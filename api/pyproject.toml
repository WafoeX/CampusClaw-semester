[project]
name = "campusclaw-api"
version = "0.1.0"
description = "Class-isolated teaching-material API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "fastapi==0.116.2",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]
campusclaw = "campusclaw.cli.main:app"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "ruff==0.12.12",
  "testcontainers[postgres]==4.12.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campusclaw"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=campusclaw --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL"]

[tool.coverage.run]
branch = true
source = ["campusclaw"]

[tool.coverage.report]
show_missing = true
skip_covered = true
