services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusclaw}
      POSTGRES_USER: ${POSTGRES_USER:-campusclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: campusclaw-api:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

  seed:
    image: campusclaw-api:local
    command: ["campusclaw", "seed-demo"]
    environment:
      APP_ENV: ${APP_ENV:-demo}
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      JWT_ACCESS_TOKEN_LIFETIME_SECONDS: >-
        ${JWT_ACCESS_TOKEN_LIFETIME_SECONDS:-28800}
      UPLOAD_ROOT: /var/lib/campusclaw/materials
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_ALPHA_TEACHER_PASSWORD: ${DEMO_ALPHA_TEACHER_PASSWORD:-}
      DEMO_ALPHA_STUDENT_PASSWORD: ${DEMO_ALPHA_STUDENT_PASSWORD:-}
      DEMO_BETA_TEACHER_PASSWORD: ${DEMO_BETA_TEACHER_PASSWORD:-}
      DEMO_BETA_STUDENT_PASSWORD: ${DEMO_BETA_STUDENT_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - materials-data:/var/lib/campusclaw/materials
    networks:
      - data

  api:
    image: campusclaw-api:local
    build:
      context: ./api
    command:
      - uvicorn
      - campusclaw.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      APP_ENV: ${APP_ENV:-demo}
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      JWT_ACCESS_TOKEN_LIFETIME_SECONDS: >-
        ${JWT_ACCESS_TOKEN_LIFETIME_SECONDS:-28800}
      UPLOAD_ROOT: /var/lib/campusclaw/materials
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
      SEED_DEMO_DATA: "false"
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DATA_BOUNDARY: ${EMBEDDING_DATA_BOUNDARY:-private}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      GENERATION_ENDPOINT: ${GENERATION_ENDPOINT:-}
      GENERATION_API_KEY: ${GENERATION_API_KEY:-}
      GENERATION_DATA_BOUNDARY: ${GENERATION_DATA_BOUNDARY:-private}
      GENERATION_MODEL: ${GENERATION_MODEL:-grounded-answer}
      GENERATION_TEMPERATURE: ${GENERATION_TEMPERATURE:-0}
      GENERATION_STRUCTURED_OUTPUT: ${GENERATION_STRUCTURED_OUTPUT:-true}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-campusclaw-knowledge-v1}
      QDRANT_DISTANCE: ${QDRANT_DISTANCE:-Cosine}
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    expose:
      - "8000"
    volumes:
      - materials-data:/var/lib/campusclaw/materials
    networks:
      - gateway
      - data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen(
              "http://127.0.0.1:8000/health", timeout=2
          )
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.15.3
    restart: unless-stopped
    # Qdrant runs without auth by default on the internal-only network.
    # Supply QDRANT__SERVICE__API_KEY via a production override when needed.
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - data
    healthcheck:
      # The minimal Qdrant image has no curl/wget; process health is the
      # executable health signal available inside the image.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  indexer:
    image: campusclaw-api:local
    command: ["campusclaw", "indexer"]
    environment:
      APP_ENV: ${APP_ENV:-demo}
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      UPLOAD_ROOT: /var/lib/campusclaw/materials
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DATA_BOUNDARY: ${EMBEDDING_DATA_BOUNDARY:-private}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-campusclaw-knowledge-v1}
      QDRANT_DISTANCE: ${QDRANT_DISTANCE:-Cosine}
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    volumes:
      - materials-data:/var/lib/campusclaw/materials:ro
    networks:
      - data

  web:
    image: campusclaw-web:local
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks:
      - gateway

volumes:
  postgres-data:
  materials-data:
  qdrant-data:

networks:
  gateway:
  data:
    internal: true
